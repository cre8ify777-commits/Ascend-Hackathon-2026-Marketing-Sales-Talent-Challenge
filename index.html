document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;

          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ms:center\"><span style=\"width:44px;height:44px;border-radius:50%;background:#F7B733;color:#262626;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:inset 0 1px 0 rgba(255,255,255,0.55),0 0 0 4px rgba(247,183,51,0.18),0 4px 18px rgba(247,183,51,0.45)\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z\"><\u002Fpath><\u002Fsvg><\u002Fspan><span style=\"flex:1;width:3px;background:#4AC6E3;margin:6px 0\"><\u002Fspan><\u002Fdiv>\n        <div style=\"margin-bottom:18px;padding:14px 18px;background:var(--amberTint,rgba(247,183,51,0.14));border:1px solid rgba(224,160,32,0.5);border-radius:16px;box-shadow:inset 0 1px 0 rgba(255,255,255,0.5);display:flex;flex-direction:column;gap:6px\"><span style=\"font-family:'Archivo',sans-serif;font-stretch:85%;font-weight:800;font-size:20px\">Follow-up 2 — Later, if appropriate:<\u002Fspan><p style=\"margin:0;font-size:16px;max-width:64ch\">Use one suitable professional channel and keep the message concise. Ask for a response or routing to the appropriate stakeholder rather than immediately requesting a long meeting.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:44px minmax(0,1fr);gap:18px\">\n        <div style=\"display:flex;flex-direction:column;align-items:center\"><span style=\"width:44px;height:44px;border-radius:50%;background:var(--blueTint,rgba(74,198,227,0.15));border:2px solid #4AC6E3;color:var(--blueText,#0B7A96);display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:inset 0 1px 0 rgba(255,255,255,0.55),0 0 0 4px rgba(74,198,227,0.18),0 4px 18px rgba(74,198,227,0.45)\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"9\" cy=\"8\" r=\"3.5\"><\u002Fcircle><path d=\"M3 20c0-3.5 2.7-6 6-6s6 2.5 6 6\"><\u002Fpath><path d=\"M16 11h6M19 8l3 3-3 3\"><\u002Fpath><\u002Fsvg><\u002Fspan><span style=\"flex:1;width:3px;background:#D64545;margin:6px 0\"><\u002Fspan><\u002Fdiv>\n        <div style=\"margin-bottom:18px;padding:14px 18px;background:var(--blueTint,rgba(74,198,227,0.12));border:1px solid rgba(74,198,227,0.45);border-radius:16px;box-shadow:inset 0 1px 0 rgba(255,255,255,0.5);display:flex;flex-direction:column;gap:6px\"><span style=\"font-family:'Archivo',sans-serif;font-stretch:85%;font-weight:800;font-size:20px\">Move to another stakeholder:<\u002Fspan><p style=\"margin:0;font-size:16px;max-width:64ch\">If the Director says someone else owns this area, follow their referral. If there is no response, a further stakeholder should only be contacted when there is a clear business reason, rather than contacting all three simultaneously.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:44px minmax(0,1fr);gap:18px\">\n        <div style=\"display:flex;flex-direction:column;align-items:center\"><span style=\"width:44px;height:44px;border-radius:12px;background:#D64545;color:#FFFFFF;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:inset 0 1px 0 rgba(255,255,255,0.55),0 0 0 4px rgba(214,69,69,0.18),0 4px 18px rgba(214,69,69,0.45)\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"currentColor\"><rect x=\"6\" y=\"6\" width=\"12\" height=\"12\" rx=\"2\"><\u002Frect><\u002Fsvg><\u002Fspan><\u002Fdiv>\n        <div style=\"background:var(--redTint,rgba(214,69,69,0.10));border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:6px;border:1px solid rgba(214,69,69,0.45);box-shadow:0 0 18px rgba(214,69,69,0.18)\"><div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px\"><span style=\"font-family:'Archivo',sans-serif;font-stretch:85%;font-weight:800;font-size:20px;color:var(--redText,#9E2626)\">Stop rule —<\u002Fspan><b style=\"background:#D64545;color:#FFFFFF;font-size:12px;letter-spacing:0.06em;padding:3px 9px;border-radius:6px\">JUDGMENT:<\u002Fb><\u002Fdiv><p style=\"margin:0;font-size:16px;max-width:64ch;color:var(--redDeep,#4A2222)\">Stop after a small, predefined number of respectful attempts with no engagement, or immediately after a clear rejection, opt-out, or negative response. Track each touch and response so the decision is based on evidence rather than simply increasing the number of messages.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <figcaption style=\"font-size:14px;color:var(--muted,#5C5C5C);border-top:1px solid var(--line,rgba(30,50,70,0.10));padding-top:14px\"><b style=\"color:var(--ink,#262626)\">Figure 3.<\u002Fb> Outreach sequence timeline, from first email to stop rule.<\u002Ffigcaption>\n  <\u002Ffigure>\n\n  <figure style=\"margin:0;background:var(--glassSolid,rgba(255,255,255,0.78));backdrop-filter:blur(16px) saturate(160%);-webkit-backdrop-filter:blur(16px) saturate(160%);border:1px solid var(--glassBorder,rgba(255,255,255,0.7));box-shadow:var(--glassHi,inset 0 1px 0 rgba(255,255,255,0.85)),var(--glassShadow,0 10px 30px rgba(28,70,100,0.10));border-radius:24px;padding:clamp(20px,4vw,36px);display:flex;flex-direction:column;gap:20px\">\n    <div style=\"display:flex;flex-direction:column;align-items:center\">\n      <div style=\"background:var(--strong,#262626);color:#FFFFFF;padding:12px 22px;border-radius:14px;font-weight:600;font-size:16px;text-align:center;display:flex;align-items:center;gap:10px;box-shadow:inset 0 1px 0 rgba(255,255,255,0.15),0 8px 22px rgba(20,30,40,0.28)\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M22 2L11 13M22 2l-7 20-4-9-9-4z\"><\u002Fpath><\u002Fsvg>Send touch (email / follow-up)<\u002Fdiv>\n      <div style=\"width:2px;height:22px;background:var(--ink,#262626)\"><\u002Fdiv>\n      <svg width=\"12\" height=\"8\" sc-camel-view-box=\"0 0 12 8\" style=\"margin-top:-2px\"><path d=\"M0 0h12L6 8z\" style=\"fill:var(--ink,#262626)\"><\u002Fpath><\u002Fsvg>\n      <div style=\"margin-top:4px;border:2px solid var(--ink,#262626);padding:10px 22px;border-radius:999px;font-weight:600;font-size:16px;text-align:center;background:var(--tile,rgba(255,255,255,0.62))\">How does the Director respond?<\u002Fdiv>\n      <div style=\"width:2px;height:22px;background:var(--ink,#262626)\"><\u002Fdiv>\n      <div style=\"width:100%;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:14px;border-top:2px solid var(--ink,#262626);padding-top:22px\">\n        <div style=\"display:flex;flex-direction:column;align-items:stretch;gap:10px\">\n          <span style=\"font-size:12px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--greenText,#1D7A4A);text-align:center\">Confirms relevance<\u002Fspan>\n          <svg width=\"12\" height=\"8\" sc-camel-view-box=\"0 0 12 8\" style=\"align-self:center\"><path d=\"M0 0h12L6 8z\" fill=\"#2E9E6A\"><\u002Fpath><\u002Fsvg>\n          <div style=\"background:var(--greenTint,rgba(46,158,106,0.12));border:2px solid #2E9E6A;border-radius:14px;padding:14px;text-align:center;font-weight:600;color:var(--greenDeep,#173F2B);display:flex;flex-direction:column;align-items:center;gap:8px;box-shadow:0 0 20px rgba(46,158,106,0.28),inset 0 1px 0 rgba(255,255,255,0.5)\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#2E9E6A\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6L9 17l-5-5\"><\u002Fpath><\u002Fsvg>Share a brief overview of our services<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;align-items:stretch;gap:10px\">\n          <span style=\"font-size:12px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--blueText,#0B5F75);text-align:center\">Redirects to someone else<\u002Fspan>\n          <svg width=\"12\" height=\"8\" sc-camel-view-box=\"0 0 12 8\" style=\"align-self:center\"><path d=\"M0 0h12L6 8z\" fill=\"#4AC6E3\"><\u002Fpath><\u002Fsvg>\n          <div style=\"background:var(--blueTint,rgba(74,198,227,0.15));border:2px solid #4AC6E3;border-radius:14px;padding:14px;text-align:center;font-weight:600;color:var(--blueDeep,#0B3F4D);display:flex;flex-direction:column;align-items:center;gap:8px;box-shadow:0 0 20px rgba(74,198,227,0.32),inset 0 1px 0 rgba(255,255,255,0.5)\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#0B7A96\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12h14M13 6l6 6-6 6\"><\u002Fpath><\u002Fsvg>Follow their referral<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;align-items:stretch;gap:10px\">\n          <span style=\"font-size:12px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--amberText,#7A5200);text-align:center\">No response<\u002Fspan>\n          <svg width=\"12\" height=\"8\" sc-camel-view-box=\"0 0 12 8\" style=\"align-self:center\"><path d=\"M0 0h12L6 8z\" fill=\"#F7B733\"><\u002Fpath><\u002Fsvg>\n          <div style=\"background:var(--amberTint,rgba(247,183,51,0.12));border:2px dashed #E0A020;border-radius:14px;padding:14px;text-align:center;font-weight:600;color:var(--amberDeep,#4A3300);box-shadow:0 0 20px rgba(247,183,51,0.25)\">Predefined number of attempts reached?<\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:8px\">\n            <div style=\"display:flex;flex-direction:column;gap:6px;align-items:stretch\">\n              <span style=\"font-size:12px;font-weight:700;color:var(--muted,#5C5C5C);text-align:center\">No<\u002Fspan>\n              <div style=\"background:var(--page,#F6F7F8);border-radius:10px;padding:10px 8px;text-align:center;font-size:14px;font-weight:600;display:flex;flex-direction:column;gap:6px;align-items:center\">Next follow-up<span style=\"display:flex;align-items:center;gap:4px;font-size:11px;font-weight:500;color:var(--muted,#5C5C5C);line-height:1.3\"><svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink:0\"><path d=\"M3 12a9 9 0 1 0 3-6.7L3 8\"><\u002Fpath><path d=\"M3 3v5h5\"><\u002Fpath><\u002Fsvg>Send touch<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:6px;align-items:stretch\">\n              <span style=\"font-size:12px;font-weight:700;color:var(--muted,#5C5C5C);text-align:center\">Yes<\u002Fspan>\n              <div style=\"background:#F7B733;color:#262626;border-radius:10px;padding:10px 8px;text-align:center;font-size:14px;font-weight:700;box-shadow:0 0 16px rgba(247,183,51,0.5),inset 0 1px 0 rgba(255,255,255,0.5)\">Stop<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;align-items:stretch;gap:10px\">\n          <span style=\"font-size:12px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--redText,#B83232);text-align:center\">Rejection / opt-out / negative<\u002Fspan>\n          <svg width=\"12\" height=\"8\" sc-camel-view-box=\"0 0 12 8\" style=\"align-self:center\"><path d=\"M0 0h12L6 8z\" fill=\"#D64545\"><\u002Fpath><\u002Fsvg>\n          <div style=\"background:#D64545;color:#FFFFFF;border-radius:14px;padding:14px;text-align:center;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:8px;box-shadow:0 0 22px rgba(214,69,69,0.45),inset 0 1px 0 rgba(255,255,255,0.3)\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"currentColor\"><rect x=\"6\" y=\"6\" width=\"12\" height=\"12\" rx=\"2\"><\u002Frect><\u002Fsvg>Stop immediately<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"margin-top:22px;display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted,#5C5C5C);background:var(--page,#F6F7F8);border-radius:999px;padding:8px 16px\"><svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 3v18h18\"><\u002Fpath><path d=\"M7 15l4-4 3 3 5-6\"><\u002Fpath><\u002Fsvg>Track each touch and response throughout.<\u002Fdiv>\n    <\u002Fdiv>\n    <figcaption style=\"font-size:14px;color:var(--muted,#5C5C5C);border-top:1px solid var(--line,rgba(30,50,70,0.10));padding-top:14px\"><b style=\"color:var(--ink,#262626)\">Figure 4.<\u002Fb> Decision flow after each touch: reply, referral, no response, or rejection.<\u002Ffigcaption>\n  <\u002Ffigure>\n<\u002Fsection>\n\n<section id=\"q4\" style=\"scroll-margin-top:80px;display:flex;flex-direction:column;gap:28px\">\n  <div style=\"background:var(--glassHeavy,rgba(255,255,255,0.42));backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);border:1px solid var(--glassBorder,rgba(255,255,255,0.7));box-shadow:var(--glassHi,inset 0 1px 0 rgba(255,255,255,0.85)),var(--glassShadow,0 10px 30px rgba(28,70,100,0.10));color:var(--ink,#262626);border-radius:24px;padding:clamp(22px,4vw,32px);display:flex;flex-wrap:wrap;align-items:flex-start;gap:18px\">\n    <span style=\"width:56px;height:56px;border-radius:16px;background:#4AC6E3;color:#262626;font-family:'Archivo',sans-serif;font-weight:900;font-size:22px;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:inset 0 1px 0 rgba(255,255,255,0.6),0 0 0 5px rgba(74,198,227,0.22),0 0 26px rgba(74,198,227,0.7)\">Q4<\u002Fspan>\n    <p style=\"margin:0;flex:1 1 280px;font-size:clamp(18px,2.2vw,22px);line-height:1.5;font-weight:500;text-wrap:pretty\">How would you refer to the Director's public activity naturally without pretending to know their priorities or personal circumstances?<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"background:var(--glassSolid,rgba(255,255,255,0.78));backdrop-filter:blur(16px) saturate(160%);-webkit-backdrop-filter:blur(16px) saturate(160%);border:1px solid var(--glassBorder,rgba(255,255,255,0.7));box-shadow:var(--glassHi,inset 0 1px 0 rgba(255,255,255,0.85)),var(--glassShadow,0 10px 30px rgba(28,70,100,0.10));border-radius:24px;padding:clamp(18px,3vw,26px);display:flex;flex-direction:column;gap:10px\">\n    <span style=\"align-self:flex-start;display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--blueText,#0B5F75);background:var(--blueTint,rgba(74,198,227,0.15));border-radius:999px;padding:4px 12px\"><svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6L9 17l-5-5\"><\u002Fpath><\u002Fsvg>Answer<\u002Fspan>\n    <h2 style=\"margin:0;font-family:'Archivo',sans-serif;font-stretch:80%;font-weight:800;font-size:clamp(28px,4vw,36px);line-height:1.1\">4. How to Refer to the Director’s Public Activity<\u002Fh2>\n  <\u002Fdiv>\n  <p style=\"margin:0;font-size:18px;font-weight:500;background:var(--glassSolid,rgba(255,255,255,0.78));backdrop-filter:blur(16px) saturate(160%);-webkit-backdrop-filter:blur(16px) saturate(160%);border:1px solid var(--glassBorder,rgba(255,255,255,0.7));box-shadow:var(--glassHi,inset 0 1px 0 rgba(255,255,255,0.85)),var(--glassShadow,0 10px 30px rgba(28,70,100,0.10));border-radius:20px;padding:18px 22px\">Refer to the activity as context, not proof of their priorities or needs:<\u002Fp>\n  <blockquote style=\"margin:0;background:var(--glassSolid,rgba(255,255,255,0.78));backdrop-filter:blur(16px) saturate(160%);-webkit-backdrop-filter:blur(16px) saturate(160%);border:1px solid var(--glassBorder,rgba(255,255,255,0.7));box-shadow:var(--glassHi,inset 0 1px 0 rgba(255,255,255,0.85)),var(--glassShadow,0 10px 30px rgba(28,70,100,0.10));border-radius:24px;border-left:0;padding:clamp(26px,5vw,48px);display:flex;flex-direction:column;gap:18px;position:relative;overflow:hidden\">\n    <span style=\"font-family:'Archivo',sans-serif;font-weight:900;font-size:120px;line-height:0.6;color:#4AC6E3;height:48px\">“<\u002Fspan>\n    <p style=\"margin:0;font-family:'Archivo',sans-serif;font-stretch:90%;font-weight:600;font-size:clamp(22px,3vw,32px);line-height:1.35;letter-spacing:-0.005em;max-width:34ch;text-wrap:pretty\">I saw your recent post about improving patient access following an industry conference. I don’t want to assume that this is currently a priority for your organization, but I wanted to ask whether mobile services are relevant to what you are exploring.”<\u002Fp>\n  <\u002Fblockquote>\n  <p style=\"margin:0;font-size:17px;max-width:72ch;color:var(--muted,#4A4A4A);background:var(--glassSolid,rgba(255,255,255,0.78));backdrop-filter:blur(16px) saturate(160%);-webkit-backdrop-filter:blur(16px) saturate(160%);border:1px solid var(--glassBorder,rgba(255,255,255,0.7));box-shadow:var(--glassHi,inset 0 1px 0 rgba(255,255,255,0.85)),var(--glassShadow,0 10px 30px rgba(28,70,100,0.10));border-radius:20px;padding:18px 22px\">This acknowledges something they publicly shared without pretending to know their personal circumstances, priorities, or requirements.<\u002Fp>\n  <figure style=\"margin:0;background:var(--glassSolid,rgba(255,255,255,0.78));backdrop-filter:blur(16px) saturate(160%);-webkit-backdrop-filter:blur(16px) saturate(160%);border:1px solid var(--glassBorder,rgba(255,255,255,0.7));box-shadow:var(--glassHi,inset 0 1px 0 rgba(255,255,255,0.85)),var(--glassShadow,0 10px 30px rgba(28,70,100,0.10));border-radius:24px;padding:clamp(20px,4vw,32px);display:flex;flex-direction:column;gap:18px\">\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:16px\">\n      <div style=\"background:var(--greenTint,rgba(46,158,106,0.12));border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:14px;border-top:5px solid #2E9E6A;border:1px solid rgba(46,158,106,0.38);box-shadow:0 0 22px rgba(46,158,106,0.14)\">\n        <span style=\"display:flex;align-items:center;gap:10px;font-family:'Archivo',sans-serif;font-stretch:85%;font-weight:800;font-size:22px;color:var(--greenDeep,#173F2B)\"><span style=\"width:32px;height:32px;border-radius:50%;background:#2E9E6A;color:#FFFFFF;display:flex;align-items:center;justify-content:center;font-size:16px\">✓<\u002Fspan>Do<\u002Fspan>\n        <div style=\"display:flex;gap:10px;align-items:flex-start;font-size:16px;color:var(--greenDeep,#173F2B)\"><span style=\"color:var(--greenText,#1D7A4A);font-weight:700\">✓<\u002Fspan><span>Refer to the activity as context<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;gap:10px;align-items:flex-start;font-size:16px;color:var(--greenDeep,#173F2B)\"><span style=\"color:var(--greenText,#1D7A4A);font-weight:700\">✓<\u002Fspan><span>Acknowledge something they publicly shared<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;gap:10px;align-items:flex-start;font-size:16px;color:var(--greenDeep,#173F2B)\"><span style=\"color:var(--greenText,#1D7A4A);font-weight:700\">✓<\u002Fspan><span>Ask whether mobile services are relevant to what they are exploring<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:var(--redTint,rgba(214,69,69,0.10));border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:14px;border-top:5px solid #D64545;border:1px solid rgba(214,69,69,0.35);box-shadow:0 0 22px rgba(214,69,69,0.12)\">\n        <span style=\"display:flex;align-items:center;gap:10px;font-family:'Archivo',sans-serif;font-stretch:85%;font-weight:800;font-size:22px;color:var(--redDeep,#4A2222)\"><span style=\"width:32px;height:32px;border-radius:50%;background:#D64545;color:#FFFFFF;display:flex;align-items:center;justify-content:center;font-size:16px\">✕<\u002Fspan>Don’t<\u002Fspan>\n        <div style=\"display:flex;gap:10px;align-items:flex-start;font-size:16px;color:var(--redDeep,#4A2222)\"><span style=\"color:var(--redText,#B83232);font-weight:700\">✕<\u002Fspan><span>Treat it as proof of their priorities or needs<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;gap:10px;align-items:flex-start;font-size:16px;color:var(--redDeep,#4A2222)\"><span style=\"color:var(--redText,#B83232);font-weight:700\">✕<\u002Fspan><span>Assume that this is currently a priority for their organization<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;gap:10px;align-items:flex-start;font-size:16px;color:var(--redDeep,#4A2222)\"><span style=\"color:var(--redText,#B83232);font-weight:700\">✕<\u002Fspan><span>Pretend to know their personal circumstances, priorities, or requirements<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <figcaption style=\"font-size:14px;color:var(--muted,#5C5C5C);border-top:1px solid var(--line,rgba(30,50,70,0.10));padding-top:14px\"><b style=\"color:var(--ink,#262626)\">Figure 5.<\u002Fb> Referencing the Director’s public activity: do vs. don’t.<\u002Ffigcaption>\n  <\u002Ffigure>\n<\u002Fsection>\n\n<\u002Fmain>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { copied: false, showIssues: false, active: null, dark: false };\n  keys = [\"subj\",\"hope\",\"myon\",\"prov\",\"allover\",\"verygood\",\"gopat\",\"collect\",\"already\",\"price\",\"compet\",\"meeting\",\"service\",\"revert\"];\n  DARK = {'--bgGrad':'linear-gradient(160deg,#0A1330 0%,#0D1B38 45%,#0B1428 100%)','--blobOp':'0.38','--glassHeavy':'rgba(18,28,52,0.48)','--glassSolid':'rgba(14,22,42,0.78)','--glassBorder':'rgba(255,255,255,0.12)','--glassBorderHi':'rgba(255,255,255,0.28)','--glassHi':'inset 0 1px 0 rgba(255,255,255,0.08)','--glassShadow':'0 10px 30px rgba(0,0,0,0.35)','--glassShadowHi':'0 18px 44px rgba(0,0,0,0.5)','--glassRed':'rgba(46,20,32,0.78)','--glassGreen':'rgba(12,40,38,0.78)','--glassBlue':'rgba(12,36,56,0.80)','--glassBar':'rgba(255,255,255,0.04)','--tile':'rgba(255,255,255,0.07)','--subtle':'rgba(255,255,255,0.06)','--line':'rgba(255,255,255,0.10)','--ink':'#E9EEF2','--muted':'#AAB4BC','--faint':'#8590A0','--strong':'#1B2A4A','--blueTint':'rgba(74,198,227,0.16)','--blueText':'#8BDDF0','--blueDeep':'#D2F2FA','--redTint':'rgba(214,69,69,0.18)','--redText':'#F5A0A0','--redDeep':'#F8D6D6','--greenTint':'rgba(46,158,106,0.20)','--greenText':'#7EDAAA','--greenDeep':'#D4F2E2','--amberTint':'rgba(247,183,51,0.16)','--amberText':'#F4CD6E','--amberDeep':'#F8E4B2'};\n  NOBLUR = { light: {'--glassHeavy':'rgba(255,255,255,0.88)','--glassSolid':'rgba(255,255,255,0.94)','--glassRed':'rgba(255,246,246,0.95)','--glassGreen':'rgba(244,253,248,0.95)','--glassBlue':'rgba(240,250,253,0.95)'}, dark: {'--glassHeavy':'rgba(18,28,52,0.93)','--glassSolid':'rgba(14,22,42,0.96)','--glassRed':'rgba(46,20,32,0.96)','--glassGreen':'rgba(12,40,38,0.96)','--glassBlue':'rgba(12,36,56,0.96)'} };\n  on = Object.fromEntries(this.keys.map(k => [k, () => { if (this.state.showIssues && this.state.active !== k) this.setState({ active: k }); }]));\n  off = () => { if (this.state.active) this.setState({ active: null }); };\n  toggleIssues = () => this.setState(s => ({ showIssues: !s.showIssues, active: null }));\n  toggleDark = () => this.setState(s => ({ dark: !s.dark }), () => { this.applyTheme(); try { localStorage.setItem('sbd021-dark', this.state.dark ? '1' : '0'); } catch (e) {} });\n  applyTheme() {\n    const r = document.documentElement, d = this.state.dark;\n    Object.keys(this.DARK).concat(Object.keys(this.NOBLUR.light)).forEach(k => r.style.removeProperty(k));\n    const vars = Object.assign({}, d ? this.DARK : {}, this.noBlur ? this.NOBLUR[d ? 'dark' : 'light'] : {});\n    Object.entries(vars).forEach(([k, val]) => r.style.setProperty(k, val));\n    r.style.colorScheme = d ? 'dark' : ''; document.body.style.background = d ? '#0A1330' : '#E9F3F8';\n  }\n  componentDidMount() {\n    this.noBlur = !(window.CSS && (CSS.supports('backdrop-filter', 'blur(1px)') || CSS.supports('-webkit-backdrop-filter', 'blur(1px)')));\n    this.applyTheme();\n    try { if (localStorage.getItem('sbd021-dark') === '1') this.setState({ dark: true }, () => this.applyTheme()); } catch (e) {}\n    this.setupReveal();\n  }\n  setupReveal() {\n    if (!('IntersectionObserver' in window) || matchMedia('(prefers-reduced-motion: reduce)').matches) return;\n    const els = [...document.querySelectorAll('main > section > *')].filter(el => el.getBoundingClientRect().top > innerHeight * 0.9);\n    this.io = new IntersectionObserver(entries => entries.forEach(e => {\n      if (!e.isIntersecting) return;\n      const el = e.target; el.style.opacity = '1'; el.style.transform = 'none'; this.io.unobserve(el);\n      setTimeout(() => { el.style.transition = ''; el.style.transform = ''; el.style.opacity = ''; }, 700);\n    }), { rootMargin: '0px 0px -8% 0px' });\n    els.forEach(el => { el.style.opacity = '0'; el.style.transform = 'translateY(22px)'; el.style.transition = 'opacity .6s ease, transform .6s cubic-bezier(.2,.7,.2,1)'; this.io.observe(el); });\n  }\n  emailText = \"Subject: Patient access and mobile healthcare\\n\\nHello [Director’s Name],\\n\\nI’m reaching out from myOnsite Healthcare. We provide mobile healthcare services, including sending trained personnel to patients’ homes for sample collection and other healthcare services.\\n\\nI saw your recent post about improving patient access following an industry conference. Mobile services may be relevant to that broader objective, but I don’t want to assume that this is currently a priority for your organization.\\n\\nWould it be relevant for me to share a brief overview of our services? If this falls outside your area, I’d also appreciate being pointed to the appropriate person.\\n\\nBest,\\n[Sender Name]\\nmyOnsite Healthcare\";\n  copyEmail = () => {\n    const done = () => { this.setState({ copied: true }); clearTimeout(this.t); this.t = setTimeout(() => this.setState({ copied: false }), 2000); };\n    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(this.emailText).then(done, () => this.fallback(done));\n    else this.fallback(done);\n  };\n  fallback(done) {\n    const ta = document.createElement('textarea'); ta.value = this.emailText; ta.style.position = 'absolute'; ta.style.left = '-9999px';\n    document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch (e) {} ta.remove(); done();\n  }\n  componentWillUnmount() { clearTimeout(this.t); if (this.io) this.io.disconnect(); }\n  renderVals() {\n    const { showIssues, active, dark } = this.state;\n    return {\n      copyEmail: this.copyEmail,\n      copyLabel: this.state.copied ? 'Copied' : 'Copy email',\n      toggleIssues: this.toggleIssues, showIssues,\n      sw: { track: showIssues ? '#D64545' : '#C9CED2', knob: showIssues ? '19px' : '3px' },\n      iss: showIssues ? { line: 'underline', bg: 'rgba(214,69,69,0.12)', cursor: 'help' } : { line: 'none', bg: 'transparent', cursor: 'text' },\n      tip: Object.fromEntries(this.keys.map(k => [k, showIssues && active === k])),\n      on: this.on, off: this.off,\n      toggleDark: this.toggleDark, dark, light: !dark\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
